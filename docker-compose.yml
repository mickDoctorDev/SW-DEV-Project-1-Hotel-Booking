# Local Redis for the rate limiter. Start it with:  npm run redis   (needs Docker Desktop running)
services:
  redis:
    image: redis:7.4-alpine
    container_name: hotel-booking-redis
    ports:
      - "127.0.0.1:6379:6379"   # only reachable from this machine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # counters are short-lived; no persistence needed
    restart: unless-stopped
